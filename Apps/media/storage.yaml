# media-data holds the shared library layout from the PRD (movies/tv/downloads/music/books)
# as subPaths of one RWX volume, mounted read-write by whichever app needs each folder.
#
# Backed by the dedicated 150Gi disk on andor-homelab-worker2 (longhorn-media
# StorageClass, single replica since that disk only exists on one node).
# Originally attached to the control-plane node (andor-homelab-master), but
# moved here since Longhorn's disk usage there competed with etcd/kube-apiserver
# for CPU/RAM on an already-tight node. Longhorn reports ~147Gi actually
# available; requesting 130Gi leaves headroom rather than filling it to the edge.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-data
  namespace: media
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: longhorn-media
  resources:
    requests:
      storage: 130Gi
---
