# media-data holds the shared library layout from the PRD (movies/tv/downloads/music/books)
# as subPaths of one RWX volume, mounted read-write by whichever app needs each folder.
#
# PLACEHOLDER SIZE: no node currently has a disk big enough to back this - the k3s
# nodes only have ~25-50Gi root disks. This PVC will stay Pending until a dedicated
# disk is attached to a node (in Proxmox) and registered with Longhorn. Resize this
# once you know the real capacity.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-data
  namespace: media
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Ti
---
