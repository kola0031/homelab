# media-data holds the shared library layout from the PRD (movies/tv/downloads/music/books)
# as subPaths of one RWX volume, mounted read-write by whichever app needs each folder.
#
# Backed by the dedicated 150Gi disk on andor-homelab-master (longhorn-media
# StorageClass, single replica since that disk only exists on one node).
# Longhorn reported ~146.6Gi actually available on that disk; requesting 130Gi
# leaves headroom rather than filling it to the edge.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-data
  namespace: media
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: longhorn-media
  resources:
    requests:
      storage: 130Gi
---
