apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bazarr
  namespace: media
spec:
  interval: 10m
  chart:
    spec:
      chart: app-template
      version: "3.7.3"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    nameOverride: bazarr
    controllers:
      main:
        containers:
          app:
            image:
              repository: lscr.io/linuxserver/bazarr
              tag: latest
            env:
              PUID: "1000"
              PGID: "1000"
              TZ: Etc/UTC
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 512Mi
    service:
      main:
        controller: main
        ports:
          http:
            port: 6767
    persistence:
      config:
        existingClaim: bazarr-config
        globalMounts:
          - path: /config
      media:
        # Same /data path as sonarr/radarr so subtitle paths line up.
        existingClaim: media-data
        globalMounts:
          - path: /data
