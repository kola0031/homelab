apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin
  namespace: media
spec:
  parentRefs:
  - name: homelab-gateway
    namespace: monitoring
  hostnames:
  - "jellyfin.local"
  rules:
  - backendRefs:
    - name: jellyfin
      port: 8096
