apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 10m
  chart:
    spec:
      chart: longhorn
      version: "1.12.0"
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
  install:
    createNamespace: true
  values:
    defaultSettings:
      # 3 nodes but small root disks (~25-50Gi each) - 2 replicas instead of the
      # default 3 leaves headroom and still survives a single node going down.
      defaultReplicaCount: 2
    persistence:
      defaultClassReplicaCount: 2
